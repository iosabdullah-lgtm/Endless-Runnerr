<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless Runner - Dev: Muhammad Abdullah</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0b0f19;
        }

        #gameCanvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            background: #0b0f19;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 25;
            pointer-events: none;
        }

        .title-box {
            text-align: left;
        }

        h1 { 
            margin: 0; 
            color: #38bdf8; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6); 
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
        }
        h3 { 
            margin: 0; 
            color: #facc15; 
            text-shadow: 0 0 5px rgba(250, 204, 21, 0.4); 
            font-size: clamp(0.55rem, 2vw, 0.7rem);
        }

        #btn-pause {
            pointer-events: auto;
            padding: 6px 14px;
            background: rgba(30, 41, 59, 0.85);
            border: none;
            color: #fff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 15px;
            text-align: center;
        }

        .overlay-screen h2 {
            color: #facc15;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .select-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            max-width: 90%;
        }

        .btn-ui {
            padding: 8px 14px;
            background: #1e293b;
            border: none;
            color: #fff;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .btn-ui.active {
            background: #38bdf8;
            color: #0b0f19;
        }

        .btn-main {
            padding: 12px 30px;
            background: #22c55e;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-store {
            padding: 10px 25px;
            background: #38bdf8;
            border: none;
            color: #0b0f19;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            cursor: pointer;
            margin-top: 8px;
        }

        .store-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
            width: 100%;
            max-width: 320px;
        }

        .store-card {
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .store-card.selected {
            border-color: #22c55e;
        }

        .controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            gap: 30px;
            z-index: 20;
            pointer-events: none;
        }

        .btn-touch {
            flex: 1;
            padding: 18px 0;
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(6px);
            border: none;
            border-radius: 16px;
            color: #ffffff;
            font-size: 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
        }

        .btn-touch:active {
            background: rgba(56, 189, 248, 0.5);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="top-bar">
            <div class="title-box">
                <h1>Endless Runner</h1>
                <h3>Dev: Muhammad Abdullah</h3>
            </div>
            <button id="btn-pause" style="display:none;">⏸</button>
        </div>

        <!-- Start Menu Overlay -->
        <div id="menu-overlay" class="overlay-screen">
            <h2>Select Weather Mode</h2>
            <div class="select-group">
                <button class="btn-ui active" onclick="setWeatherMode('AUTO', this)">Auto Dynamic</button>
                <button class="btn-ui" onclick="setWeatherMode('SUMMER', this)">Summer ☀️</button>
                <button class="btn-ui" onclick="setWeatherMode('RAINY', this)">Rainy 🌧️</button>
                <button class="btn-ui" onclick="setWeatherMode('STORM', this)">Storm ⚡</button>
                <button class="btn-ui" onclick="setWeatherMode('WINTER', this)">Winter ❄️</button>
            </div>
            <button class="btn-main" onclick="startGame()">START GAME 🚀</button>
            <button class="btn-store" onclick="openStore()">🛍️ STORE (Coins: <span id="menu-coins">0</span>)</button>
        </div>

        <!-- Store Menu Overlay -->
        <div id="store-overlay" class="overlay-screen" style="display:none;">
            <h2>Character Store 🛍️</h2>
            <p style="color: #facc15; margin-bottom: 10px;">Available Coins: 🪙 <span id="store-coins">0</span></p>
            
            <div class="store-items">
                <div class="store-card" id="card-classic">
                    <span style="color:#fff; font-weight:bold;">🏃‍♂️ Classic Runner</span>
                    <button class="btn-ui active" style="padding:4px 10px;" id="btn-char-0" onclick="buyOrSelectCharacter(0, 0)">Equipped</button>
                </div>
                <div class="store-card" id="card-ninja">
                    <span style="color:#fff; font-weight:bold;">🥷 Ninja Runner</span>
                    <button class="btn-ui" style="padding:4px 10px;" id="btn-char-1" onclick="buyOrSelectCharacter(1, 100)">100 🪙</button>
                </div>
                <div class="store-card" id="card-pro">
                    <span style="color:#fff; font-weight:bold;">⚡ Pro Lightning</span>
                    <button class="btn-ui" style="padding:4px 10px;" id="btn-char-2" onclick="buyOrSelectCharacter(2, 250)">250 🪙</button>
                </div>
            </div>

            <button class="btn-main" onclick="closeStore()">🔙 BACK TO MENU</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls-overlay">
            <div class="btn-touch" id="btn-duck">👇</div>
            <div class="btn-touch" id="btn-jump">🏃‍♂️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnPause = document.getElementById('btn-pause');
        const menuOverlay = document.getElementById('menu-overlay');
        const storeOverlay = document.getElementById('store-overlay');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, type, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function resizeCanvasResolution() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resizeCanvasResolution);
        resizeCanvasResolution();

        let score = 0;
        let coins = parseInt(localStorage.getItem('runner_coins')) || 0;
        let highScore = localStorage.getItem('runner_highscore') || 0;
        let unlockedChars = JSON.parse(localStorage.getItem('runner_unlocked')) || [true, false, false];
        let currentChar = parseInt(localStorage.getItem('runner_current_char')) || 0;

        document.getElementById('menu-coins').innerText = coins;

        function openStore() {
            document.getElementById('store-coins').innerText = coins;
            updateStoreUI();
            menuOverlay.style.display = 'none';
            storeOverlay.style.display = 'flex';
        }

        function closeStore() {
            storeOverlay.style.display = 'none';
            menuOverlay.style.display = 'flex';
            document.getElementById('menu-coins').innerText = coins;
        }

        function updateStoreUI() {
            document.getElementById('store-coins').innerText = coins;
            for(let i=0; i<3; i++) {
                let btn = document.getElementById('btn-char-' + i);
                if(currentChar === i) {
                    btn.innerText = 'Equipped';
                    btn.style.background = '#22c55e';
                } else if(unlockedChars[i]) {
                    btn.innerText = 'Select';
                    btn.style.background = '#38bdf8';
                } else {
                    let cost = i === 1 ? 100 : 250;
                    btn.innerText = cost + ' 🪙';
                    btn.style.background = '#1e293b';
                }
            }
        }

        function buyOrSelectCharacter(index, price) {
            if(unlockedChars[index]) {
                currentChar = index;
                localStorage.setItem('runner_current_char', currentChar);
            } else if(coins >= price) {
                coins -= price;
                unlockedChars[index] = true;
                currentChar = index;
                localStorage.setItem('runner_coins', coins);
                localStorage.setItem('runner_unlocked', JSON.stringify(unlockedChars));
                localStorage.setItem('runner_current_char', currentChar);
                playSound(600, 'sine', 0.2);
            } else {
                playSound(150, 'sawtooth', 0.2);
            }
            updateStoreUI();
        }

        let level = 1;
        let gameOver = false;
        let isPaused = false;
        let gameStarted = false;
        let gameSpeed = 5.5;
        let frame = 0;
        let selectedMode = 'AUTO';

        const weathers = [
            { name: 'SUMMER', skyTop: [56, 189, 248], skyBot: [2, 132, 199], groundTop: [22, 197, 94], rain: 0, snow: 0, speedMult: 1.0 },
            { name: 'RAINY', skyTop: [71, 85, 105], skyBot: [30, 41, 59], groundTop: [21, 128, 61], rain: 1.2, snow: 0, speedMult: 1.1 },
            { name: 'STORM', skyTop: [15, 23, 42], skyBot: [2, 6, 23], groundTop: [15, 23, 42], rain: 2.0, snow: 0, speedMult: 1.25 },
            { name: 'WINTER', skyTop: [148, 163, 184], skyBot: [71, 85, 105], groundTop: [241, 245, 249], rain: 0, snow: 1.5, speedMult: 0.9 }
        ];

        let currentWeatherIdx = 0;
        let nextWeatherIdx = 1;
        let transitionFactor = 0;
        let lightning = false;

        let particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speedY: Math.random() * 8 + 4,
                speedX: Math.random() * 2 - 1,
                length: Math.random() * 15 + 10,
                size: Math.random() * 3 + 2
            });
        }

        let clouds = [
            { x: 100, y: 50, z: 0.5, r: 30 },
            { x: 400, y: 80, z: 0.8, r: 45 },
            { x: 700, y: 40, z: 0.4, r: 25 }
        ];

        const player = {
            x: 80,
            y: 0,
            width: 60,
            height: 85,
            dy: 0,
            gravity: 0.6,
            jumpForce: -13,
            isJumping: false,
            isDucking: false
        };

        let obstacles = [];
        let collectibleCoins = [];
        let spawnTimer = 0;

        function setWeatherMode(mode, btn) {
            selectedMode = mode;
            document.querySelectorAll('.select-group .btn-ui').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (mode !== 'AUTO') {
                let idx = weathers.findIndex(w => w.name === mode);
                if (idx !== -1) {
                    currentWeatherIdx = idx;
                    nextWeatherIdx = idx;
                }
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            menuOverlay.style.display = 'none';
            btnPause.style.display = 'block';
            gameStarted = true;
            resetGame();
        }

        btnPause.addEventListener('click', () => {
            if (!gameStarted || gameOver) return;
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? '▶' : '⏸';
            if (!isPaused) animate();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
            if (e.code === 'ArrowDown') { 
                if(!player.isDucking) { player.isDucking = true; playSound(200, 'sine', 0.1); }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') player.isDucking = false;
        });

        const btnJump = document.getElementById('btn-jump');
        const btnDuck = document.getElementById('btn-duck');

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
        btnDuck.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            if(!player.isDucking) { player.isDucking = true; playSound(200, 'sine', 0.1); }
        });
        btnDuck.addEventListener('touchend', (e) => { e.preventDefault(); player.isDucking = false; });

        canvas.addEventListener('mousedown', jump);

        function jump() {
            if (!player.isJumping && !gameOver && !player.isDucking && gameStarted && !isPaused) {
                player.dy = player.jumpForce;
                player.isJumping = true;
                playSound(400, 'triangle', 0.15);
            } else if (gameOver) {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            level = 1;
            gameSpeed = 5.5;
            obstacles = [];
            collectibleCoins = [];
            gameOver = false;
            isPaused = false;
            btnPause.innerText = '⏸';
            if (selectedMode === 'AUTO') {
                currentWeatherIdx = 0;
                nextWeatherIdx = 1;
            }
            transitionFactor = 0;
            player.dy = 0;
            player.isJumping = false;
            player.isDucking = false;
            animate();
        }

        function lerpColor(c1, c2, factor) {
            let r = Math.round(c1[0] + (c2[0] - c1[0]) * factor);
            let g = Math.round(c1[1] + (c2[1] - c1[1]) * factor);
            let b = Math.round(c1[2] + (c2[2] - c1[2]) * factor);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function updateWeatherLogic() {
            if (selectedMode === 'AUTO') {
                transitionFactor += 0.0008;
                if (transitionFactor >= 1) {
                    transitionFactor = 0;
                    currentWeatherIdx = nextWeatherIdx;
                    nextWeatherIdx = (nextWeatherIdx + 1) % weathers.length;
                }
            } else {
                transitionFactor = 0;
            }

            let curr = weathers[currentWeatherIdx];
            if (curr.name === 'STORM' && Math.random() < 0.04) {
                lightning = true;
            } else {
                lightning = false;
            }
        }

        function drawDynamicWeather() {
            let skyHeight = canvas.height * 0.65;
            let groundHeight = canvas.height * 0.35;

            if (lightning) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            let curr = weathers[currentWeatherIdx];
            let next = weathers[nextWeatherIdx];

            let skyTopColor = lerpColor(curr.skyTop, next.skyTop, transitionFactor);
            let skyBotColor = lerpColor(curr.skyBot, next.skyBot, transitionFactor);
            let groundColor = lerpColor(curr.groundTop, next.groundTop, transitionFactor);

            let skyGrad = ctx.createLinearGradient(0, 0, 0, skyHeight);
            skyGrad.addColorStop(0, skyTopColor);
            skyGrad.addColorStop(1, skyBotColor);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, skyHeight);

            clouds.forEach(c => {
                c.x -= c.z * 1.5;
                if (c.x < -150) c.x = canvas.width + 150;

                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.arc(c.x + c.r * 0.7, c.y - c.r * 0.2, c.r * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x - c.r * 0.6, c.y + c.r * 0.1, c.r * 0.6, 0, Math.PI * 2);
                ctx.fill();
            });

            let groundGrad = ctx.createLinearGradient(0, skyHeight, 0, canvas.height);
            groundGrad.addColorStop(0, groundColor);
            groundGrad.addColorStop(1, '#3f2305');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, skyHeight, canvas.width, groundHeight);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            let offset = (frame * gameSpeed) % 50;
            for (let x = -offset; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, skyHeight + 5);
                ctx.lineTo(x - 25, canvas.height);
                ctx.stroke();
            }

            let currentRain = curr.rain + (next.rain - curr.rain) * transitionFactor;
            let currentSnow = curr.snow + (next.snow - curr.snow) * transitionFactor;

            if (currentRain > 0.05) {
                ctx.strokeStyle = `rgba(186, 230, 253, ${Math.min(currentRain, 0.9)})`;
                ctx.lineWidth = currentRain > 1.5 ? 3 : 1.8;
                particles.forEach(p => {
                    p.y += p.speedY + (currentRain > 1.5 ? 6 : 2);
                    p.x += p.speedX - 2;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - 5, p.y + p.length);
                    ctx.stroke();
                });
            } else if (currentSnow > 0.05) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(currentSnow, 0.95)})`;
                particles.forEach(p => {
                    p.y += p.speedY * 0.4;
                    p.x += Math.sin(frame * 0.05 + p.y) * 2;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size + 1, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        function drawHumanRunner(x, y, isDucking, isJumping, animFrame) {
            ctx.save();
            ctx.translate(x, y);

            let shirtColor1 = '#ea580c', shirtColor2 = '#f97316';
            if (currentChar === 1) { shirtColor1 = '#1e293b'; shirtColor2 = '#0f172a'; }
            else if (currentChar === 2) { shirtColor1 = '#eab308'; shirtColor2 = '#ca8a04'; }

            let isRunning = !isJumping && !isDucking;
            let cycle = isRunning ? Math.sin(animFrame * 0.35) : 0;
            
            let legSwing = cycle * 0.6;
            let armSwing = cycle * 0.7;

            let shadowAlpha = isJumping ? 0.15 : 0.4;
            ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
            ctx.beginPath(); 
            ctx.ellipse(28, isDucking ? 60 : 82, 30, 8, 0, 0, Math.PI * 2); 
            ctx.fill();

            if (isDucking) {
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 10; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(14, 38); ctx.lineTo(0, 56); ctx.lineTo(12, 58); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(14, 38); ctx.lineTo(26, 56); ctx.lineTo(38, 58); ctx.stroke();
                
                let torsoGrad = ctx.createLinearGradient(0, 20, 32, 38);
                torsoGrad.addColorStop(0, shirtColor1); torsoGrad.addColorStop(1, shirtColor2);
                ctx.fillStyle = torsoGrad;
                ctx.beginPath(); ctx.ellipse(20, 30, 20, 12, -0.4, 0, Math.PI * 2); ctx.fill();

                let headGrad = ctx.createRadialGradient(32, 18, 2, 32, 18, 11);
                headGrad.addColorStop(0, '#ffedd5'); headGrad.addColorStop(1, '#fed7aa');
                ctx.fillStyle = headGrad;
                ctx.beginPath(); ctx.arc(32, 18, 11, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(32, 16, 11, Math.PI, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = shirtColor1; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(18, 26); ctx.lineTo(32, 35); ctx.stroke();
            } else {
                ctx.strokeStyle = shirtColor1; ctx.lineWidth = 8; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(24, 25);
                let backArmX = 24 - Math.sin(-armSwing) * 16;
                let backArmY = 25 + Math.cos(-armSwing) * 16;
                ctx.lineTo(backArmX, backArmY); ctx.lineTo(backArmX - 6, backArmY + 10); ctx.stroke();

                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 12; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(24, 46);
                let backKneeX = 24 + Math.sin(-legSwing) * 18;
                let backKneeY = 46 + Math.cos(-legSwing) * 18;
                ctx.lineTo(backKneeX, backKneeY); ctx.lineTo(backKneeX - Math.sin(-legSwing) * 12, backKneeY + 16); ctx.stroke();

                let shirtGrad = ctx.createLinearGradient(10, 20, 35, 48);
                shirtGrad.addColorStop(0, shirtColor1);
                shirtGrad.addColorStop(0.7, shirtColor2);
                shirtGrad.addColorStop(1, '#0f172a');
                ctx.fillStyle = shirtGrad;
                ctx.beginPath(); ctx.moveTo(10, 24); ctx.lineTo(34, 24); ctx.lineTo(28, 50); ctx.lineTo(14, 50); ctx.closePath(); ctx.fill();

                ctx.fillStyle = '#fed7aa'; ctx.fillRect(18, 16, 8, 8);

                let headGrad = ctx.createRadialGradient(22, 10, 2, 22, 10, 11);
                headGrad.addColorStop(0, '#ffedd5');
                headGrad.addColorStop(1, '#fed7aa');
                ctx.fillStyle = headGrad;
                ctx.beginPath(); ctx.arc(22, 10, 11, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(22, 8, 11.2, Math.PI * 0.8, Math.PI * 2.1); ctx.fill();

                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 12.5; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(24, 46);
                let frontKneeX = 24 + Math.sin(legSwing) * 18;
                let frontKneeY = 46 + Math.cos(legSwing) * 18;
                ctx.lineTo(frontKneeX, frontKneeY); ctx.lineTo(frontKneeX - Math.sin(legSwing) * 12, frontKneeY + 16); ctx.stroke();

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.ellipse(frontKneeX - Math.sin(legSwing) * 12 + 2, frontKneeY + 16, 8, 4, 0, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = shirtColor1; ctx.lineWidth = 9; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(24, 24);
                let frontArmX = 24 - Math.sin(armSwing) * 16;
                let frontArmY = 24 + Math.cos(armSwing) * 16;
                ctx.lineTo(frontArmX, frontArmY); ctx.lineTo(frontArmX + 6, frontArmY + 10); ctx.stroke();
            }

            ctx.restore();
        }

        function drawCoin(x, y, animFrame) {
            ctx.save();
            ctx.translate(x, y);
            let scaleX = Math.abs(Math.sin(animFrame * 0.1));
            ctx.scale(scaleX, 1);

            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#d97706';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🪙', 0, 0);

            ctx.restore();
        }

        function drawRealisticParrot(x, y, animFrame, width, height) {
            ctx.save();
            ctx.translate(x, y);

            let scaleX = width / 40;
            let scaleY = height / 25;
            ctx.scale(scaleX, scaleY);

            let wingFlap = Math.sin(animFrame * 0.3) * 16;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(18, 60, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

            let bodyGrad = ctx.createLinearGradient(0, 5, 28, 18);
            bodyGrad.addColorStop(0, '#22c55e'); bodyGrad.addColorStop(0.6, '#16a34a'); bodyGrad.addColorStop(1, '#15803d');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.ellipse(18, 12, 18, 7, -0.1, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#0d9488';
            ctx.beginPath(); ctx.moveTo(30, 13); ctx.lineTo(46, 18); ctx.lineTo(32, 15); ctx.closePath(); ctx.fill();

            let wingGrad = ctx.createLinearGradient(12, 10, 26, 10 - wingFlap);
            wingGrad.addColorStop(0, '#f59e0b'); wingGrad.addColorStop(0.5, '#10b981'); wingGrad.addColorStop(1, '#0284c7');
            ctx.fillStyle = wingGrad;
            ctx.beginPath(); ctx.moveTo(12, 10); ctx.quadraticCurveTo(21, 10 - wingFlap * 1.3, 29, 5 - wingFlap); ctx.quadraticCurveTo(21, 14, 14, 16); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.moveTo(4, 10); ctx.quadraticCurveTo(-5, 12, -2, 18); ctx.lineTo(4, 14); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(7, 10, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(6.5, 10, 1.4, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function draw3DCrate(x, y, width, height) {
            ctx.save();
            ctx.translate(x, y);

            let frontGrad = ctx.createLinearGradient(0, 0, width, height);
            frontGrad.addColorStop(0, '#b45309'); frontGrad.addColorStop(0.7, '#78350f'); frontGrad.addColorStop(1, '#451a03');
            ctx.fillStyle = frontGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#d97706';
            ctx.fillRect(0, 0, width, 6); ctx.fillRect(0, height - 6, width, 6);
            ctx.fillRect(0, 0, 6, height); ctx.fillRect(width - 6, 0, 6, height);

            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(3, 3, 3, 3); ctx.fillRect(width - 6, 3, 3, 3);
            ctx.fillRect(3, height - 6, 3, 3); ctx.fillRect(width - 6, height - 6, 3, 3);

            ctx.strokeStyle = '#451a03'; ctx.lineWidth = 3.5;
            ctx.beginPath(); ctx.moveTo(3, 3); ctx.lineTo(width - 3, height - 3); ctx.moveTo(width - 3, 3); ctx.lineTo(3, height - 3); ctx.stroke();

            ctx.restore();
        }

        function animate() {
            if (!gameStarted || isPaused) return;

            if (gameOver) {
                playSound(150, 'sawtooth', 0.4);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('runner_highscore', highScore);
                }
                localStorage.setItem('runner_coins', coins);

                ctx.fillStyle = 'rgba(11, 15, 25, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 20px Arial';
                ctx.fillText('Score: ' + score + ' | High: ' + highScore, canvas.width / 2, canvas.height / 2);

                ctx.fillStyle = '#22c55e';
                ctx.fillText('Total Coins 🪙: ' + coins, canvas.width / 2, canvas.height / 2 + 40);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '15px Arial';
                ctx.fillText('Tap JUMP to Play Again', canvas.width / 2, canvas.height / 2 + 85);
                ctx.textAlign = 'left';
                return;
            }

            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            frame++;
            level = Math.floor(score / 300) + 1;

            updateWeatherLogic();
            drawDynamicWeather();

            let groundY = canvas.height * 0.65;
            let playerFloorY = groundY - player.height;

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > playerFloorY) {
                player.y = playerFloorY;
                player.dy = 0;
                player.isJumping = false;
            }

            let currentY = player.isDucking ? player.y + 30 : player.y;
            drawHumanRunner(player.x, currentY, player.isDucking, player.isJumping, frame);

            spawnTimer++;
            if (spawnTimer > Math.max(45, 90 - (gameSpeed * 3))) {
                let randType = Math.random();
                if (randType > 0.55) {
                    let heights = [groundY - 105, groundY - 75];
                    obstacles.push({ x: canvas.width, y: heights[Math.floor(Math.random() * heights.length)], width: 70, height: 38, type: 'bird' });
                } else if (randType > 0.25) {
                    obstacles.push({ x: canvas.width, y: groundY - 60, width: 75, height: 60, type: 'crate' });
                } else {
                    for(let c = 0; c < 3; c++) {
                        collectibleCoins.push({ x: canvas.width + (c * 35), y: groundY - 110, collected: false });
                    }
                }
                spawnTimer = 0;
            }

            let currentHeight = player.isDucking ? 45 : 85;

            for (let i = 0; i < collectibleCoins.length; i++) {
                let coin = collectibleCoins[i];
                coin.x -= gameSpeed;
                if (!coin.collected) {
                    drawCoin(coin.x, coin.y, frame);
                    if (
                        player.x < coin.x + 15 &&
                        player.x + player.width > coin.x - 15 &&
                        currentY < coin.y + 15 &&
                        currentY + currentHeight > coin.y - 15
                    ) {
                        coin.collected = true;
                        coins += 10;
                        playSound(800, 'sine', 0.08);
                    }
                }
            }
            collectibleCoins = collectibleCoins.filter(c => c.x + 20 > 0 && !c.collected);

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (obs.type === 'crate') {
                    draw3DCrate(obs.x, obs.y, obs.width, obs.height);
                } else {
                    drawRealisticParrot(obs.x, obs.y, frame, obs.width, obs.height);
                }

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    currentY < obs.y + obs.height &&
                    currentY + currentHeight > obs.y
                ) {
                    gameOver = true;
                }
            }

            obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

            score++;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('Score: ' + score, canvas.width - 150, 30);
            ctx.fillStyle = '#facc15';
            ctx.fillText('🪙 Coins: ' + coins, canvas.width - 150, 55);

            let currName = weathers[currentWeatherIdx].name;
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(`Lvl ${level} | ${currName}`, 20, 30);

            let speedMult = weathers[currentWeatherIdx].speedMult || 1.0;
            gameSpeed += 0.0012 * speedMult;
        }
    </script>
