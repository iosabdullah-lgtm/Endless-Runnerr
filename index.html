<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Smooth Weather Human Runner - Dev: Muhammad Abdullah</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            touch-action: manipulation;
        }

        header {
            text-align: center;
            padding: 4px 5px;
            width: 100%;
            z-index: 10;
        }

        h1 { 
            margin: 0; 
            color: #38bdf8; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6); 
            font-size: clamp(0.85rem, 3.5vw, 1.2rem);
        }
        h3 { 
            margin: 0; 
            color: #facc15; 
            text-shadow: 0 0 5px rgba(250, 204, 21, 0.4); 
            font-size: clamp(0.6rem, 2.2vw, 0.75rem);
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px;
            overflow: hidden;
        }

        #gameCanvas {
            border: 2px solid #38bdf8;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            width: 100% !important;
            height: 100% !important;
            max-width: 800px;
            max-height: 450px;
            object-fit: contain;
            background: #0b0f19;
        }

        /* UI Overlays */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .overlay-screen h2 {
            color: #facc15;
            font-size: clamp(1rem, 4vw, 1.3rem);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .select-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
            max-width: 90%;
        }

        .btn-ui {
            padding: 6px 10px;
            background: #1e293b;
            border: 2px solid #38bdf8;
            color: #fff;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-ui.active {
            background: #38bdf8;
            color: #0b0f19;
        }

        .btn-start {
            padding: 10px 24px;
            background: #22c55e;
            border: none;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
            cursor: pointer;
        }

        #btn-pause {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 25;
            padding: 4px 10px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8;
            color: #fff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        /* In-Canvas Overlay Controls */
        .controls-overlay {
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 100%;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            z-index: 20;
            pointer-events: none;
        }

        .btn-touch {
            flex: 1;
            padding: 10px 0;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(56, 189, 248, 0.85);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .btn-touch:active {
            background: rgba(56, 189, 248, 0.9);
            color: #0f172a;
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <header>
        <h1>3D Weather Runner</h1>
        <h3>Dev: Muhammad Abdullah</h3>
    </header>

    <div id="game-wrapper">
        <button id="btn-pause" style="display:none;">PAUSE ⏸</button>
        
        <!-- Start / Weather Selector Overlay -->
        <div id="menu-overlay" class="overlay-screen">
            <h2>Select Weather Mode</h2>
            <div class="select-group">
                <button class="btn-ui active" onclick="setWeatherMode('AUTO', this)">Auto Dynamic</button>
                <button class="btn-ui" onclick="setWeatherMode('SUMMER', this)">Summer ☀️</button>
                <button class="btn-ui" onclick="setWeatherMode('RAINY', this)">Rainy 🌧️</button>
                <button class="btn-ui" onclick="setWeatherMode('STORM', this)">Storm ⚡</button>
                <button class="btn-ui" onclick="setWeatherMode('WINTER', this)">Winter ❄️</button>
            </div>
            <button class="btn-start" onclick="startGame()">START GAME 🚀</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Touch Controls Inside Game Area -->
        <div class="controls-overlay">
            <div class="btn-touch" id="btn-duck">DUCK 👇</div>
            <div class="btn-touch" id="btn-jump">JUMP 🏃‍♂️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnPause = document.getElementById('btn-pause');
        const menuOverlay = document.getElementById('menu-overlay');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function resizeCanvasResolution() {
            canvas.width = 800;
            canvas.height = 450;
        }
        resizeCanvasResolution();

        let score = 0;
        let highScore = localStorage.getItem('runner_highscore') || 0;
        let level = 1;
        let gameOver = false;
        let isPaused = false;
        let gameStarted = false;
        let gameSpeed = 5.5;
        let frame = 0;
        let selectedMode = 'AUTO';

        const weathers = [
            { name: 'SUMMER', skyTop: [56, 189, 248], skyBot: [2, 132, 199], groundTop: [22, 197, 94], rain: 0, snow: 0 },
            { name: 'RAINY', skyTop: [71, 85, 105], skyBot: [30, 41, 59], groundTop: [21, 128, 61], rain: 1, snow: 0 },
            { name: 'STORM', skyTop: [15, 23, 42], skyBot: [2, 6, 23], groundTop: [15, 23, 42], rain: 1.5, snow: 0 },
            { name: 'WINTER', skyTop: [148, 163, 184], skyBot: [71, 85, 105], groundTop: [241, 245, 249], rain: 0, snow: 1 }
        ];

        let currentWeatherIdx = 0;
        let nextWeatherIdx = 1;
        let transitionFactor = 0;
        let lightning = false;

        let particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * 800,
                y: Math.random() * 450,
                speedY: Math.random() * 8 + 4,
                speedX: Math.random() * 2 - 1,
                length: Math.random() * 12 + 8,
                size: Math.random() * 3 + 2
            });
        }

        let clouds = [
            { x: 100, y: 40, z: 0.5, r: 25 },
            { x: 350, y: 65, z: 0.8, r: 35 },
            { x: 600, y: 35, z: 0.4, r: 20 }
        ];

        const player = {
            x: 60,
            y: 0,
            width: 55,
            height: 75,
            dy: 0,
            gravity: 0.6,
            jumpForce: -12,
            isJumping: false,
            isDucking: false
        };

        let obstacles = [];
        let spawnTimer = 0;

        function setWeatherMode(mode, btn) {
            selectedMode = mode;
            document.querySelectorAll('.select-group .btn-ui').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (mode !== 'AUTO') {
                let idx = weathers.findIndex(w => w.name === mode);
                if (idx !== -1) {
                    currentWeatherIdx = idx;
                    nextWeatherIdx = idx;
                }
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            menuOverlay.style.display = 'none';
            btnPause.style.display = 'block';
            gameStarted = true;
            resetGame();
        }

        btnPause.addEventListener('click', () => {
            if (!gameStarted || gameOver) return;
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? 'RESUME ▶' : 'PAUSE ⏸';
            if (!isPaused) animate();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
            if (e.code === 'ArrowDown') { player.isDucking = true; playSound(200, 'sine', 0.1); }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') player.isDucking = false;
        });

        const btnJump = document.getElementById('btn-jump');
        const btnDuck = document.getElementById('btn-duck');

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
        btnDuck.addEventListener('touchstart', (e) => { e.preventDefault(); player.isDucking = true; playSound(200, 'sine', 0.1); });
        btnDuck.addEventListener('touchend', (e) => { e.preventDefault(); player.isDucking = false; });

        canvas.addEventListener('mousedown', jump);

        function jump() {
            if (!player.isJumping && !gameOver && !player.isDucking && gameStarted && !isPaused) {
                player.dy = player.jumpForce;
                player.isJumping = true;
                playSound(400, 'triangle', 0.15);
            } else if (gameOver) {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            level = 1;
            gameSpeed = 5.5;
            obstacles = [];
            gameOver = false;
            isPaused = false;
            btnPause.innerText = 'PAUSE ⏸';
            if (selectedMode === 'AUTO') {
                currentWeatherIdx = 0;
                nextWeatherIdx = 1;
            }
            transitionFactor = 0;
            player.dy = 0;
            player.isJumping = false;
            player.isDucking = false;
            animate();
        }

        function lerpColor(c1, c2, factor) {
            let r = Math.round(c1[0] + (c2[0] - c1[0]) * factor);
            let g = Math.round(c1[1] + (c2[1] - c1[1]) * factor);
            let b = Math.round(c1[2] + (c2[2] - c1[2]) * factor);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function updateWeatherLogic() {
            if (selectedMode === 'AUTO') {
                transitionFactor += 0.0005;
                if (transitionFactor >= 1) {
                    transitionFactor = 0;
                    currentWeatherIdx = nextWeatherIdx;
                    nextWeatherIdx = (nextWeatherIdx + 1) % weathers.length;
                }
            } else {
                transitionFactor = 0;
            }

            let curr = weathers[currentWeatherIdx];
            if (curr.name === 'STORM' && Math.random() < 0.02) {
                lightning = true;
            } else {
                lightning = false;
            }
        }

        function drawDynamicWeather() {
            let skyHeight = canvas.height * 0.60;
            let groundHeight = canvas.height * 0.40;

            if (lightning) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            let curr = weathers[currentWeatherIdx];
            let next = weathers[nextWeatherIdx];

            let skyTopColor = lerpColor(curr.skyTop, next.skyTop, transitionFactor);
            let skyBotColor = lerpColor(curr.skyBot, next.skyBot, transitionFactor);
            let groundColor = lerpColor(curr.groundTop, next.groundTop, transitionFactor);

            let skyGrad = ctx.createLinearGradient(0, 0, 0, skyHeight);
            skyGrad.addColorStop(0, skyTopColor);
            skyGrad.addColorStop(1, skyBotColor);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, skyHeight);

            clouds.forEach(c => {
                c.x -= c.z * 1.2;
                if (c.x < -100) c.x = canvas.width + 100;

                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.arc(c.x + c.r * 0.7, c.y - c.r * 0.2, c.r * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x - c.r * 0.6, c.y + c.r * 0.1, c.r * 0.6, 0, Math.PI * 2);
                ctx.fill();
            });

            let groundGrad = ctx.createLinearGradient(0, skyHeight, 0, canvas.height);
            groundGrad.addColorStop(0, groundColor);
            groundGrad.addColorStop(1, '#3f2305');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, skyHeight, canvas.width, groundHeight);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            let offset = (frame * gameSpeed) % 40;
            for (let x = -offset; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, skyHeight + 5);
                ctx.lineTo(x - 20, canvas.height);
                ctx.stroke();
            }

            let currentRain = curr.rain + (next.rain - curr.rain) * transitionFactor;
            let currentSnow = curr.snow + (next.snow - curr.snow) * transitionFactor;

            if (currentRain > 0.05) {
                ctx.strokeStyle = `rgba(186, 230, 253, ${Math.min(currentRain, 0.85)})`;
                ctx.lineWidth = currentRain > 1 ? 2 : 1.2;
                particles.forEach(p => {
                    p.y += p.speedY + (currentRain > 1 ? 4 : 0);
                    p.x += p.speedX - 2;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - 4, p.y + p.length);
                    ctx.stroke();
                });
            } else if (currentSnow > 0.05) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(currentSnow, 0.9)})`;
                particles.forEach(p => {
                    p.y += p.speedY * 0.3;
                    p.x += Math.sin(frame * 0.05 + p.y) * 1.5;
                    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        function drawHumanRunner(x, y, isDucking, isJumping, animFrame) {
            ctx.save();
            ctx.translate(x, y);

            let isRunning = !isJumping && !isDucking;
            let cycle = isRunning ? Math.sin(animFrame * 0.35) : 0;
            
            let legSwing = cycle * 0.6;
            let armSwing = cycle * 0.7;

            let shadowAlpha = isJumping ? 0.15 : 0.4;
            ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
            ctx.beginPath(); 
            ctx.ellipse(24, isDucking ? 50 : 72, 26, 7, 0, 0, Math.PI * 2); 
            ctx.fill();

            if (isDucking) {
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 8; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(12, 32); ctx.lineTo(0, 46); ctx.lineTo(10, 48); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(12, 32); ctx.lineTo(22, 46); ctx.lineTo(32, 48); ctx.stroke();
                
                let torsoGrad = ctx.createLinearGradient(0, 18, 28, 32);
                torsoGrad.addColorStop(0, '#f97316'); torsoGrad.addColorStop(1, '#c2410c');
                ctx.fillStyle = torsoGrad;
                ctx.beginPath(); ctx.ellipse(18, 26, 17, 10, -0.4, 0, Math.PI * 2); ctx.fill();

                let headGrad = ctx.createRadialGradient(28, 16, 2, 28, 16, 9);
                headGrad.addColorStop(0, '#ffedd5'); headGrad.addColorStop(1, '#fed7aa');
                ctx.fillStyle = headGrad;
                ctx.beginPath(); ctx.arc(28, 16, 9, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(28, 14, 9, Math.PI, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#f97316'; ctx.lineWidth = 7;
                ctx.beginPath(); ctx.moveTo(16, 22); ctx.lineTo(28, 30); ctx.stroke();
            } else {
                ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 7; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(20, 22);
                let backArmX = 20 - Math.sin(-armSwing) * 14;
                let backArmY = 22 + Math.cos(-armSwing) * 14;
                ctx.lineTo(backArmX, backArmY); ctx.lineTo(backArmX - 5, backArmY + 8); ctx.stroke();

                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 10; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(20, 40);
                let backKneeX = 20 + Math.sin(-legSwing) * 16;
                let backKneeY = 40 + Math.cos(-legSwing) * 16;
                ctx.lineTo(backKneeX, backKneeY); ctx.lineTo(backKneeX - Math.sin(-legSwing) * 10, backKneeY + 14); ctx.stroke();

                let shirtGrad = ctx.createLinearGradient(8, 18, 30, 40);
                shirtGrad.addColorStop(0, '#ea580c'); shirtGrad.addColorStop(0.7, '#f97316'); shirtGrad.addColorStop(1, '#c2410c');
                ctx.fillStyle = shirtGrad;
                ctx.beginPath(); ctx.moveTo(8, 20); ctx.lineTo(28, 20); ctx.lineTo(24, 42); ctx.lineTo(12, 42); ctx.closePath(); ctx.fill();

                ctx.fillStyle = '#fed7aa'; ctx.fillRect(16, 14, 6, 6);

                let headGrad = ctx.createRadialGradient(19, 9, 2, 19, 9, 9.5);
                headGrad.addColorStop(0, '#ffedd5'); headGrad.addColorStop(1, '#fed7aa');
                ctx.fillStyle = headGrad;
                ctx.beginPath(); ctx.arc(19, 9, 9.5, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(19, 7, 9.8, Math.PI * 0.8, Math.PI * 2.1); ctx.fill();

                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 10.5; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(20, 40);
                let frontKneeX = 20 + Math.sin(legSwing) * 16;
                let frontKneeY = 40 + Math.cos(legSwing) * 16;
                ctx.lineTo(frontKneeX, frontKneeY); ctx.lineTo(frontKneeX - Math.sin(legSwing) * 10, frontKneeY + 14); ctx.stroke();

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.ellipse(frontKneeX - Math.sin(legSwing) * 10 + 2, frontKneeY + 14, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = '#f97316'; ctx.lineWidth = 7.5; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(20, 20);
                let frontArmX = 20 - Math.sin(armSwing) * 14;
                let frontArmY = 20 + Math.cos(armSwing) * 14;
                ctx.lineTo(frontArmX, frontArmY); ctx.lineTo(frontArmX + 5, frontArmY + 8); ctx.stroke();
            }

            ctx.restore();
        }

        function drawRealisticParrot(x, y, animFrame, width, height) {
            ctx.save();
            ctx.translate(x, y);

            let scaleX = width / 35;
            let scaleY = height / 22;
            ctx.scale(scaleX, scaleY);

            let wingFlap = Math.sin(animFrame * 0.3) * 14;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(15, 55, 12, 4, 0, 0, Math.PI * 2); ctx.fill();

            let bodyGrad = ctx.createLinearGradient(0, 5, 24, 15);
            bodyGrad.addColorStop(0, '#22c55e'); bodyGrad.addColorStop(0.6, '#16a34a'); bodyGrad.addColorStop(1, '#15803d');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.ellipse(15, 10, 15, 6, -0.1, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#0d9488';
            ctx.beginPath(); ctx.moveTo(26, 11); ctx.lineTo(40, 16); ctx.lineTo(28, 13); ctx.closePath(); ctx.fill();

            let wingGrad = ctx.createLinearGradient(10, 8, 22, 8 - wingFlap);
            wingGrad.addColorStop(0, '#f59e0b'); wingGrad.addColorStop(0.5, '#10b981'); wingGrad.addColorStop(1, '#0284c7');
            ctx.fillStyle = wingGrad;
            ctx.beginPath(); ctx.moveTo(10, 8); ctx.quadraticCurveTo(18, 8 - wingFlap * 1.3, 25, 4 - wingFlap); ctx.quadraticCurveTo(18, 12, 12, 14); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.moveTo(3, 8); ctx.quadraticCurveTo(-4, 10, -2, 15); ctx.lineTo(3, 12); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(6, 8, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(5.5, 8, 1.2, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function draw3DCrate(x, y, width, height) {
            ctx.save();
            ctx.translate(x, y);

            let frontGrad = ctx.createLinearGradient(0, 0, width, height);
            frontGrad.addColorStop(0, '#b45309'); frontGrad.addColorStop(0.7, '#78350f'); frontGrad.addColorStop(1, '#451a03');
            ctx.fillStyle = frontGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#d97706';
            ctx.fillRect(0, 0, width, 5); ctx.fillRect(0, height - 5, width, 5);
            ctx.fillRect(0, 0, 5, height); ctx.fillRect(width - 5, 0, 5, height);

            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(2, 2, 2, 2); ctx.fillRect(width - 4, 2, 2, 2);
            ctx.fillRect(2, height - 4, 2, 2); ctx.fillRect(width - 4, height - 4, 2, 2);

            ctx.strokeStyle = '#451a03'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(2, 2); ctx.lineTo(width - 2, height - 2); ctx.moveTo(width - 2, 2); ctx.lineTo(2, height - 2); ctx.stroke();

            ctx.restore();
        }

        function animate() {
            if (!gameStarted || isPaused) return;

            if (gameOver) {
                playSound(120, 'sawtooth', 0.4);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('runner_highscore', highScore);
                }

                ctx.fillStyle = 'rgba(11, 15, 25, 0.88)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('High Score: ' + highScore, canvas.width / 2, canvas.height / 2 + 15);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '13px Arial';
                ctx.fillText('Tap JUMP / Space to Play Again', canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = 'left';
                return;
            }

            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            frame++;

            level = Math.floor(score / 300) + 1;

            updateWeatherLogic();
            drawDynamicWeather();

            let groundY = canvas.height * 0.60;
            let playerFloorY = groundY - player.height;

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > playerFloorY) {
                player.y = playerFloorY;
                player.dy = 0;
                player.isJumping = false;
            }

            let currentY = player.isDucking ? player.y + 25 : player.y;
            drawHumanRunner(player.x, currentY, player.isDucking, player.isJumping, frame);

            spawnTimer++;
            if (spawnTimer > Math.max(45, 95 - (gameSpeed * 3))) {
                let isBird = Math.random() > 0.45;
                if (isBird) {
                    let heights = [groundY - 80, groundY - 55, groundY - 30];
                    let chosenHeight = heights[Math.floor(Math.random() * heights.length)];
                    obstacles.push({ x: canvas.width, y: chosenHeight, width: 60, height: 32, type: 'bird' });
                } else {
                    obstacles.push({ x: canvas.width, y: groundY - 50, width: 65, height: 50, type: 'crate' });
                }
                spawnTimer = 0;
            }

            let currentHeight = player.isDucking ? 40 : 75;

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (obs.type === 'crate') {
                    draw3DCrate(obs.x, obs.y, obs.width, obs.height);
                } else {
                    drawRealisticParrot(obs.x, obs.y, frame, obs.width, obs.height);
                }

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    currentY < obs.y + obs.height &&
                    currentY + currentHeight > obs.y
                ) {
                    gameOver = true;
                }
            }

            obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

            score++;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('Score: ' + score, canvas.width - 110, 22);
            ctx.fillStyle = '#facc15';
            ctx.fillText('High: ' + highScore, canvas.width - 110, 40);

            let currName = weathers[currentWeatherIdx].name;
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(`Lvl ${level} | Weather: ${currName}`, 12, 22);

            gameSpeed += 0.0012;
        }
    </script>
</body>
</html>
